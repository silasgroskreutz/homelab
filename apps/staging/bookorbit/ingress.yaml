apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: bookorbit.silasgroskreutz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookorbit
                port:
                  number: 3000
  tls:
    - hosts:
        - bookorbit.silasgroskreutz.com
      secretName: bookorbit-tls
