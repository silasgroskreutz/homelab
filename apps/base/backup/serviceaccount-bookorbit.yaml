apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-bookorbit
  # The namespace is set by the staging overlay (namespace: backup).
  # This account exists so that the ONE backup job that needs a
  # credential - the BookOrbit PostgreSQL dump - does not run as the
  # namespace's default identity. It grants nothing on its own: the
  # PostgreSQL password is what it reads out of the SOPS-encrypted
  # Secret, and that password is scoped to a database user.
