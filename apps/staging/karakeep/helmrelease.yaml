apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: HelmChart
    name: karakeep
    namespace: flux-system
  # NEXTAUTH_SECRET and MEILI_MASTER_KEY are pulled out of the
  # SOPS-encrypted Secret so the chart renders stable credentials instead of
  # regenerating them on every upgrade.
  valuesFrom:
    - kind: Secret
      name: karakeep-secret
      valuesKey: NEXTAUTH_SECRET
      targetPath: applicationSecretKey
    - kind: Secret
      name: karakeep-secret
      valuesKey: MEILI_MASTER_KEY
      targetPath: meilisearchMasterKey
    # iCloud SMTP app-specific password. Pulled out of the SOPS-encrypted
    # Secret and injected as a secretKeyRef so it never appears in the
    # StatefulSet spec or in plain-text Helm values.
    - kind: Secret
      name: karakeep-secret
      valuesKey: SMTP_PASSWORD
      targetPath: smtpPassword
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    applicationProtocol: https
    applicationHost: karakeep.silasgroskreutz.com
    controllers:
      karakeep:
        type: statefulset
        containers:
          karakeep:
            env:
              # Inference stays on the LAN. If the Mac sleeps or drops off the
              # network, AI tagging/summarization degrades; saving, browsing
              # and search keep working.
              AI_PROVIDER: ollama
              OLLAMA_BASE_URL: "http://192.168.0.105:11434"
              INFERENCE_TEXT_MODEL: "qwen3:8b"
              AI_MODEL: "qwen3:8b"
              # Outbound email via iCloud SMTP (app-specific password from
              # karakeep-secret). Powers the "forgot password" reset flow.
              SMTP_HOST: smtp.mail.me.com
              SMTP_PORT: "587"
              SMTP_SECURE: "false"
              SMTP_USER: silasgroskreutz@icloud.com
              SMTP_FROM: silasgroskreutz@icloud.com
              # This instance is reachable from the internet, so open
              # self-service signup would let anyone in. Existing users and
              # invited users are unaffected; new accounts come from the
              # admin invite flow only. Requires SMTP to be working, which
              # it now is.
              DISABLE_SIGNUPS: "true"
              EMAIL_VERIFICATION_REQUIRED: "true"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 1536Mi
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 10Gi
              globalMounts:
                - path: /data
      chrome:
        containers:
          chrome:
            # The upstream gcr.io/zenika-hub/alpine-chrome image can no longer
            # be pulled (GCR requires billing). The Docker Hub image is the
            # same build and is pullable on the cluster node.
            image:
              repository: docker.io/zenika/alpine-chrome
              tag: "124"
    # The chart renders a Secret named "karakeep" from this map, and the
    # karakeep container consumes it via envFrom — so anything listed here
    # becomes an environment variable inside the pod. SMTP_PASSWORD comes
    # from the SOPS-encrypted karakeep-secret via valuesFrom, so the plain
    # text never appears in git or in the StatefulSet spec.
    secrets:
      karakeep:
        enabled: true
        stringData:
          SMTP_PASSWORD: "{{ .Values.smtpPassword }}"
    meilisearch:
      auth:
        # NOTE: the spelling here is deliberate and must match the chart's
        # own secret key exactly. The upstream chart's values.yaml declares
        # the secret under the key "meilesearch" (typo in upstream), which
        # renders a Secret literally named "karakeep-meilesearch". The
        # meilisearch subchart only renders its own master-key secret when
        # existingMasterKeySecret is EMPTY, so when we point it at a secret
        # it must point at the one the parent chart actually creates.
        # Renaming this to the "correct" spelling karakeep-meilisearch
        # leaves the pod referencing a secret that nothing renders -> the
        # pod never goes Ready -> helm --wait times out -> upgrade fails.
        existingMasterKeySecret: karakeep-meilesearch
      environment:
        MEILI_ENV: production
      persistence:
        enabled: true
        size: 5Gi
    ingress:
      karakeep:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: karakeep.silasgroskreutz.com
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: karakeep
                  port: http
        tls:
          - secretName: karakeep-tls
            hosts:
              - karakeep.silasgroskreutz.com
