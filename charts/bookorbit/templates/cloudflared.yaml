{{- if .Values.cloudflare.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  labels:
    {{- include "bookorbit.labels" . | nindent 4 }}
data:
  config.yaml: |
    tunnel: {{ .Values.cloudflare.tunnel }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: {{ .Values.cloudflare.hostname }}
      service: {{ .Values.cloudflare.service }}
    - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    {{- include "bookorbit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflare.replicas }}
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: {{ .Values.cloudflare.image }}
        imagePullPolicy: IfNotPresent
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: {{ .Values.cloudflare.credentialsSecretName }}
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
{{- end }}
