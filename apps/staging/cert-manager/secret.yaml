apiVersion: v1
kind: Secret
metadata:
    name: cloudflare-api-token
    namespace: cert-manager
type: Opaque
# Cloudflare API token used by cert-manager's DNS-01 solver to create and
# delete _acme-challenge TXT records for this zone.
#
# The solver reads this secret from the cert-manager namespace with key
# "api-key" (see ClusterIssuer/letsencrypt-prod). cert-manager's controller
# runs with --cluster-resource-namespace, so the secret MUST live in the
# namespace cert-manager itself runs in — not in the namespace of the
# Certificate that needs it.
#
# Token permissions: Zone / DNS / Edit + Zone / Zone / Read.
# It deliberately does NOT have Cloudflare Tunnel permissions; tunnel
# credentials live in each app's own namespace as a separate secret.
#
# Rotating this token: create a new one in the Cloudflare dashboard, then
#   sops -e -i apps/staging/cert-manager/secret.yaml
# and commit. cert-manager picks up the new value on its next reconcile and
# uses it for all subsequent renewals.
#
# Lost or revoked token = every certificate in the cluster stops renewing.
# Certificates issued here are valid for 90 days and renew at ~60 days, so a
# broken token shows up as a failed renewal roughly two months after it is
# revoked. Verify renewal after rotating.
