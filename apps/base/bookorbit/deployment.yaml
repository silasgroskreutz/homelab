apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookorbit
  template:
    metadata:
      labels:
        app: bookorbit
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bookorbit
          image: docker/library/bookorbit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_URL
              value: "http://bookorbit.silasgroskreutz.com"
            - name: BOOKS_HOST_PATH
              value: "/data/books"
            - name: POSTGRES_PASSWORD
              value: "ROTATED_BO_POSTGRES_PASSWORD"
            - name: JWT_SECRET
              value: "ROTATED_BO_JWT_SECRET"
            - name: SETUP_BOOTSTRAP_TOKEN
              value: "ROTATED_BO_SETUP_BOOTSTRAP_TOKEN"
          volumeMounts:
            - name: bookorbit-data
              mountPath: /data/books
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: bookorbit-data
          persistentVolumeClaim:
            claimName: bookorbit-data-pvc
