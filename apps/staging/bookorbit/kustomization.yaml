apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookorbit
resources:
  # Namespace object only. The workload itself is a Helm chart.
  - ../../base/bookorbit
  # Flux sources the chart from the existing flux-system GitRepository.
  - helmrelease.yaml
  # SOPS-encrypted. Flux decrypts these with the cluster's age key.
  - secret.yaml
  - tunnel-secret.yaml
