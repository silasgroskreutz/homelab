apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bookorbit.fullname" . }}
  labels:
    {{- include "bookorbit.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate: the app takes a migration lock on /data, so two writers
    # during a rollout would fight.
    type: Recreate
  selector:
    matchLabels:
      {{- include "bookorbit.selectorLabels" . | nindent 6 }}
      # A Deployment selector is immutable, and the postgres pod shares the
      # name/instance labels, so the component label is what keeps the
      # Deployment from adopting the database pod.
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "bookorbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        fsGroup: {{ .Values.app.puid }}
        runAsUser: {{ .Values.app.puid }}
        runAsGroup: {{ .Values.app.pgid }}
        seccompProfile:
          type: RuntimeDefault
      # Upstream compose gates the app on postgres being healthy and runs
      # migrations before the server starts. The init container reproduces
      # that ordering without a hand-written wait loop in the app.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "bookorbit.postgresFullname" . }} -p {{ .Values.postgres.port }} -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do
                echo "waiting for postgres..."
                sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: bookorbit
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          securityContext:
            # Upstream compose: cap_drop ALL, no-new-privileges, read_only
            # root filesystem with a tmpfs at /tmp.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: APP_URL
              value: {{ .Values.app.appUrl | quote }}
            - name: CLIENT_URL
              value: {{ .Values.app.clientUrl | quote }}
            - name: TZ
              value: {{ .Values.app.timezone | quote }}
            - name: PUID
              value: {{ .Values.app.puid | quote }}
            - name: PGID
              value: {{ .Values.app.pgid | quote }}
            - name: NODE_MAX_OLD_SPACE_SIZE
              value: {{ .Values.app.nodeMaxOldSpaceSize | quote }}
            - name: LIBRARY_BROWSE_ROOT
              value: {{ .Values.app.libraryBrowseRoot | quote }}
            - name: DISABLE_LOCAL_AUTH
              value: "false"
            - name: POSTGRES_HOST
              value: {{ include "bookorbit.postgresFullname" . }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: JWT_SECRET
            - name: SETUP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: SETUP_BOOTSTRAP_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
            - name: books
              mountPath: /books
              readOnly: {{ .Values.persistence.books.readOnly }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          # The upstream image ships this exact health endpoint.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bookorbit.fullname" . }}-data
        - name: books
          hostPath:
            path: {{ .Values.persistence.books.hostPath }}
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
