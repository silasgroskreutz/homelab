apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchenowl-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchenowl-test
  template:
    metadata:
      labels:
        app: kitchenowl-test
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        # The all-in-one image: Flutter web frontend + Flask backend + uWSGI
        # on a single port 8080. Verified on Prodesk that /, /api/* and the
        # socket.io websocket upgrade all work through this one container.
        - name: kitchenowl-test
          # Patched build of tombursch/kitchenowl:v0.8.1.
          #
          # Upstream emits `autocomplete="newUsername"` on the onboarding
          # username field. "newUsername" is not a valid HTML autocomplete
          # token, so Chromium/Brave discard it and fall back to heuristic
          # autofill detection on that field. Brave's heuristic path can pop
          # an address-autofill suggestion mid-typing, and that popup
          # crashes the whole browser process (EXC_BREAKPOINT / SIGTRAP):
          #   brave/brave-browser#60052
          #   brave/brave-browser#59759
          # The bundle is patched at build time to emit the valid
          # `username` token instead. See tools/kitchenowl-patch/.
          #
          # This image (patched2) ALSO fixes DELIVERY of that fix:
          #  - the bundle is published under a content-hashed name
          #    (main.dart.<sha256[:12]>.js) and the Flutter loader's build
          #    config points at it, so a new build always yields a new URL;
          #  - index.html references the loader with a build-scoped query
          #    string, versioning the whole index -> loader -> bundle chain;
          #  - the origin now sends a real Cache-Control policy (upstream
          #    main's uwsgi rules), so Cloudflare no longer imposes its
          #    default 4-hour max-age on the frontend and the legacy
          #    unhashed main.dart.js is served no-cache.
          # Without this, clients kept the pre-fix bundle for hours after
          # the token fix was deployed.
          image: 192.168.0.101:5000/kitchenowl-test@sha256:578d323703a51a2ea8311ea9138aef3a4d6ebd4f253e303ed90a6107010670ee
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Must match the public URL exactly (including scheme) or the
            # socket.io origin check rejects the browser client.
            - name: FRONT_URL
              value: "https://kitchenowl-test.silasgroskreutz.com"
            # The upstream default is PLEASE_CHANGE_ME. Never run that.
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kitchenowl-test
                  key: JWT_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health/8M4F88S8ooi4sMbLBfkkV7ctWwgibW6V
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/8M4F88S8ooi4sMbLBfkkV7ctWwgibW6V
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kitchenowl-test-data-pvc
