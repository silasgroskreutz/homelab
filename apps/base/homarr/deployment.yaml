apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:latest
          # The upstream image ships no USER directive and its entrypoint writes
          # /etc/nginx/nginx.conf, which requires root. Running as uid 1000
          # makes the container fail with "cannot create /etc/nginx/nginx.conf".
          # fsGroup above still keeps the /appdata PVC group-writable.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: homarr-configmap
                  key: PORT
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: secret-encryption-key
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /appdata
              name: homarr-data
      volumes:
        - name: homarr-data
          persistentVolumeClaim:
            claimName: homarr-data