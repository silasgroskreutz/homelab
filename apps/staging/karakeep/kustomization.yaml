apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: karakeep
resources:
  # Namespace object only. The workload itself is the upstream Helm chart.
  - ../../base/karakeep
  - helmrelease.yaml
  # SOPS-encrypted. Flux decrypts these with the cluster's age key.
  - secret.yaml
  - tunnel-secret.yaml
  # cloudflared Deployment + ConfigMap for the karakeep tunnel.
  - cloudflare.yaml
