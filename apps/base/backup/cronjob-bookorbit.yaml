apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookorbit-backup
spec:
  # 02:17 every day. BookOrbit's PostgreSQL dump is about 1.4 MB and its
  # cover tree is about 300 MB, so this is the largest job of the four.
  #
  # It runs at 02:17, clear of Linkding at 00:37, clear of changedetection
  # at 04:23 and clear of Navidrome at 05:43 - no two backups are ever on
  # the CIFS share at the same minute. The odd minute also avoids the
  # on-the-hour and 03:00 spikes (03:00:00 is when the whole fleet of cron
  # jobs on the internet wakes up at once).
  schedule: "17 2 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          # This is the only backup job that needs a credential, so it runs
          # as its own service account rather than the namespace default.
          serviceAccountName: backup-bookorbit
          securityContext:
            # Mandatory for the CIFS share, see the changedetection job.
            runAsUser: 1000
            runAsGroup: 0
            fsGroup: 1000
          containers:
            - name: backup
              image: 192.168.0.101:5000/homelab-backup@sha256:42b1e01087ed854d6130646b6765b668704ebc07e8ac9fd876cbbdc9d5d2e4e8
              imagePullPolicy: IfNotPresent
              # The dump and the cover tree run back to back in ONE pod, so
              # the two writes to the CIFS share are sequential rather than
              # concurrent. The database and the cover tree are the two
              # halves of one application's state and belong to one
              # schedule.
              command: ["python3", "/scripts/backup.py", "--config", "/scripts/config.json", "--only", "bookorbit", "--only", "bookorbit-covers"]
              env:
                # The PostgreSQL password. It lives in a SOPS-encrypted
                # Secret in THIS namespace: Kubernetes Secrets are
                # namespace-scoped, so the credential cannot be read out of
                # the bookorbit namespace, and a ConfigMap is not a place
                # for a password.
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-postgres
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # The cover tree is about 300 MB in 1,154 files: it is
                  # read, gzipped, staged, copied and read back for the
                  # digest check.
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: nas
                  mountPath: /backups
                - name: datastore
                  # Read-only: the backup must never write to the app's
                  # live data.
                  mountPath: /bookorbit
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: nas
              hostPath:
                path: /mnt/nas-roms
                type: Directory
            - name: datastore
              # The BookOrbit PVC lives in the `bookorbit` namespace and a
              # PVC can only be mounted by a pod in the SAME namespace as
              # the claim. This CronJob lives in the dedicated `backup`
              # namespace, so the PVC cannot be mounted directly.
              #
              # Single-node k3s, local-path provisioner: the volume lives in
              # a directory on the node and is mounted here read-only. The
              # path embeds the PVC's UID, so it changes if the PVC is
              # recreated; the engine then fails loudly on the missing
              # datastore instead of archiving an empty directory.
              #
              # The mount point is the PVC ROOT, which holds covers/ (the
              # only non-empty subtree, 300 MB) next to book-bucket/,
              # book-dock/, read-aloud/, tmp/ and upload-sessions/ (all
              # empty).
              #
              # Current value:
              #   ./tools/backup/datastore-path.sh bookorbit
              hostPath:
                path: /var/lib/rancher/k3s/storage/pvc-67d08d6a-22b0-45a3-bf96-534b992d6831_bookorbit_bookorbit-data
                type: Directory
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0444
