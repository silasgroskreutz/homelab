apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 35m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    timeout: 30m
    remediation:
      retries: 2
  upgrade:
    # CRDs are already at the chart's version. Create avoids deleting every
    # PrometheusRule/ServiceMonitor/Prometheus CR when the CRD is replaced.
    crds: Create
    timeout: 30m
    remediation:
      retries: 2
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    defaultRules:
      rules:
        # k3s runs the controller-manager, scheduler and kube-proxy inside the
        # apiserver process, so there are no endpoints to scrape and these
        # alerts can only ever fire as false positives on a single-node k3s.
        #
        # Disable the whole rule GROUP, not just the alert. Setting
        # defaultRules.disabled.<Alert> removes only the alert body and leaves
        # a group with "rules: null", which the PrometheusRule CRD rejects:
        #   spec.groups[0].rules: Invalid value: "null": must be of type array
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeProxy: false
    alertmanager:
      alertmanagerSpec:
        # Use our own config (ntfy receivers) instead of the chart default,
        # which routes everything to a receiver named "null".
        configSecret: alertmanager-config-secret
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - alerts.silasgroskreutz.com
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alerts.silasgroskreutz.com
    grafana:
      admin:
        # Credentials live in a sops-encrypted Secret, never in this repo.
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - grs.silasgroskreutz.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grs.silasgroskreutz.com
